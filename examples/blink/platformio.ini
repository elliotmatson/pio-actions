; Fixture firmware for pio-actions' own end-to-end tests.
;
; Small enough to build quickly, but shaped like the real repos: two board envs
; so the build matrix has something to fan out over, a host env for unit tests,
; and a partition table so the size report has a real ceiling.

[platformio]
name = pio-actions blink example
description = Minimal blink used to exercise the shared workflows
; Board envs only. A bare `pio run` would otherwise walk into [env:native],
; whose host toolchain has no Arduino.h -- the same trap lp-p2p documents.
default_envs =
    esp32dev
    esp32s3

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
board_build.partitions = partitions.csv
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=0

[env:esp32dev]
board = esp32dev
build_flags =
    ${env.build_flags}
    -DLED_PIN=2

[env:esp32s3]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DLED_PIN=48

; Host-side unit tests: `pio test -e native`. test_build_src defaults to no, so
; src/main.cpp and its Arduino.h are never pulled into this build.
[env:native]
platform = native
build_flags =
    -std=c++17
    -Wall
    -Wextra
