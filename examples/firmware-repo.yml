# A complete caller. Drop this in a firmware repo as
# .github/workflows/build-release.yml.
name: build-release

on:
  workflow_dispatch:
    inputs:
      release-type:
        type: choice
        description: Stable Release, Beta Release, or Build?
        options: [stable, beta, build]
        default: build
      release-version:
        type: string
        description: Firmware Version (ignored for Build)
        default: vX.X.X
        required: true
  pull_request:

jobs:
  firmware:
    uses: elliotmatson/pio-actions/.github/workflows/build-release.yml@v1
    permissions:
      contents: write
    with:
      release-type: ${{ inputs.release-type || 'build' }}
      release-version: ${{ inputs.release-version || '' }}
      # Every env in default_envs gets its own job.
      envs: default
      # Optional: anything the project needs to run against a fresh build,
      # such as verifying an embedded firmware descriptor.
      # post-build-run: python3 scripts/verify_descriptor.py
    secrets:
      # Only needed when lib_deps points at private repositories.
      gh-token: ${{ secrets.GH_PAT }}
