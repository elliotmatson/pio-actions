name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pyelftools
      - run: python -m pytest tests -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # These workflows are the product, so a syntax error here breaks every
      # consuming repo at once rather than just this one.
      - uses: raven-actions/actionlint@v2
        with:
          files: ".github/workflows/*.yml"
