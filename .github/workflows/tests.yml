# Everything that guards this repo, in one run: the Python behind the actions,
# the workflow syntax, the host-side unit tests, and a real firmware build of
# examples/blink driven through the reusable workflow itself.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release-type:
        description: >-
          Exercise the release path. 'build' is the normal test run; 'beta' and
          'stable' actually publish a release from the fixture firmware.
        type: choice
        options: [build, beta, stable]
        default: build
      release-version:
        description: Tag to publish. Ignored unless release-type is beta or stable.
        type: string
        default: ""

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    name: python unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pytest pyelftools
      - run: python -m pytest tests -q

  lint:
    name: workflow syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # These workflows are the product: a syntax error here breaks every
      # consuming repo at once, not just this one.
      - uses: raven-actions/actionlint@v2
        with:
          files: ".github/workflows/*.yml"

  native:
    name: firmware unit tests (host)
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read
      pull-requests: write
    with:
      project-dir: examples/blink
      envs: native
      actions-ref: ${{ github.sha }}

  token-persistence:
    name: setup-pio exports its token
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./actions/setup-pio
        with:
          project-dir: examples/blink
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          cache-packages: "false"
      # The fixture has only public dependencies, so a broken token would go
      # unnoticed here until some other repo's private lib_deps failed to
      # clone. Assert the export directly instead.
      - name: The token must still be set in a later step
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::setup-pio did not export GH_TOKEN; private lib_deps will fail to clone"
            exit 1
          fi
          echo "GH_TOKEN is set for subsequent steps"

  firmware:
    name: build examples/blink
    uses: ./.github/workflows/build-release.yml
    permissions:
      # write, not read: a dispatched release run publishes from this job, and
      # a reusable workflow's permissions are validated before any 'if' decides
      # whether the release job runs at all.
      contents: write
      # Needed by the size-diff comment. Without it the diff still reaches the
      # job summary, so this is an upgrade rather than a requirement.
      pull-requests: write
    with:
      project-dir: examples/blink
      release-type: ${{ inputs.release-type || 'build' }}
      release-version: ${{ inputs.release-version || '' }}
      envs: default
      # Test the actions from this commit rather than from the last tag, so a
      # pull request validates its own changes.
      actions-ref: ${{ github.sha }}
      retention-days: 7
      # Exercises the extra-target loop and PIO_ENV. `size` is used rather than
      # `buildfs` because it works for every env; buildfs is the motivating case
      # but is project-specific, and a blink fixture has no filesystem.
      targets: size

  analysis:
    name: static analysis
    uses: ./.github/workflows/static-analysis.yml
    permissions:
      contents: read
      pull-requests: write
    with:
      project-dir: examples/blink
      # One environment is enough to exercise the pipeline; checking all three
      # would triple the run for no extra signal.
      envs: esp32dev
      actions-ref: ${{ github.sha }}

  verify:
    name: verify size manifests
    needs: firmware
    runs-on: ubuntu-latest
    env:
      # The envs examples/blink builds by default. Declared once: two steps
      # assert against it, and they must not be able to drift apart.
      EXPECTED_ENVS: esp32dev esp32s3 esp32dev-idf
      # examples/blink/partitions.csv: app0 and app1 are both 0x1E0000.
      EXPECTED_APP_PARTITION: "1966080"
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: firmware-*
          merge-multiple: true
          path: dist

      - run: ls -l dist

      - name: Assert the merged factory image was published
        run: |
          for env in $EXPECTED_ENVS; do
            ls dist/"$env"-*-factory.bin >/dev/null \
              || { echo "::error::$env: no merged factory image staged"; exit 1; }
          done

      - name: Assert the manifests describe a real build
        run: |
          python3 - <<'PY'
          import glob, json, os, re, sys

          expected = os.environ["EXPECTED_ENVS"].split()
          ceiling = int(os.environ["EXPECTED_APP_PARTITION"])
          failures = []

          def check(cond, msg):
              if not cond:
                  failures.append(msg)

          found = sorted(glob.glob("dist/*-manifest.json"))
          check(len(found) == len(expected),
                f"expected {len(expected)} manifests, found {found}")

          for env in expected:
              path = f"dist/{env}-manifest.json"
              if not os.path.isfile(path):
                  failures.append(f"{path} missing")
                  continue
              m = json.load(open(path))
              print(json.dumps(m, indent=2, sort_keys=True))

              # An Arduino blink is a few hundred KB; anything tiny means the
              # image was not actually produced.
              check(m["bin_bytes"] and m["bin_bytes"] > 100_000,
                    f"{env}: implausible image size {m['bin_bytes']}")
              check(m["flash_bytes"] and m["flash_bytes"] > 0, f"{env}: no flash total")
              check(m["ram_bytes"] and m["ram_bytes"] > 0, f"{env}: no RAM total")
              # An ESP32 image has no plain .text: code lands in .flash.text and
              # .iram0.text. Assert on what the classifier is for -- some code
              # section exists, and the per-section numbers add up to the totals.
              check(any("text" in name for name in m["sections"]),
                    f"{env}: no code section in {sorted(m['sections'])}")
              check(sum(s["flash"] for s in m["sections"].values()) == m["flash_bytes"],
                    f"{env}: section flash figures do not sum to flash_bytes")
              check(sum(s["ram"] for s in m["sections"].values()) == m["ram_bytes"],
                    f"{env}: section RAM figures do not sum to ram_bytes")

              # The whole partition chain: read board_build.partitions, resolve
              # the CSV, pick the smaller OTA slot.
              check(m["app_partition_bytes"] == ceiling,
                    f"{env}: app partition {m['app_partition_bytes']} != {ceiling}")
              check(m["partition_pct"] and 0 < m["partition_pct"] < 100,
                    f"{env}: partition_pct {m['partition_pct']} out of range")

              # The manifest is written before the staging step renames anything,
              # so these are build-directory names.
              check("firmware.bin" in m["artifacts"],
                    f"{env}: no firmware.bin in {sorted(m['artifacts'])}")
              for name, meta in m["artifacts"].items():
                  check(re.fullmatch(r"[0-9a-f]{64}", meta["sha256"]),
                        f"{env}: bad sha256 for {name}")

              print(f"{env}: {m['bin_bytes']} B, {m['partition_pct']}% of app partition")

          if failures:
              print("\n".join(f"::error::{f}" for f in failures))
              sys.exit(1)
          print("all manifests verified")
          PY
