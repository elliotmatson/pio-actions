# Reusable build + release for PlatformIO / pioarduino firmware.
#
# Builds one job per environment instead of a single serial `pio run`, hands
# binaries between jobs as artifacts rather than smuggling them through the
# cache, and attaches a size manifest to every build.
name: build-release

on:
  workflow_call:
    inputs:
      release-type:
        description: stable, beta, or build.
        type: string
        default: build
      release-version:
        description: Required for stable and beta. Ignored for build.
        type: string
        default: ""
      envs:
        description: >-
          "default" mirrors a bare `pio run`, "all" forces every env, or pass an
          explicit list.
        type: string
        default: default
      runs-on:
        type: string
        default: ubuntu-latest
      python-version:
        type: string
        default: "3.12"
      pio-version:
        type: string
        default: "6.1.19"
      project-dir:
        type: string
        default: "."
      fetch-depth:
        description: >-
          Full history by default: ESP-IDF derives PROJECT_VER, and so
          esp_app_desc_t.version, from `git describe --tags`, which a shallow
          clone reduces to a bare hash.
        type: number
        default: 0
      version-flags:
        description: >-
          Template for the version macros, with {version}, {type} and {repo}
          substituted. Defaults to what most of the firmware repos expect; set
          it to something else when a project reads different names, or to an
          empty string to inject nothing.
        type: string
        default: >-
          -DFW_VERSION='"{version}"' -DFW_TYPE='"{type}"' -DREPO_URL='"{repo}"'
      build-flags:
        description: Extra flags appended to PLATFORMIO_BUILD_FLAGS verbatim.
        type: string
        default: ""
      targets:
        description: >-
          Additional `pio run` targets to build per environment, space
          separated -- `buildfs` for a project that ships a filesystem image.
          Each runs after the default build.
        type: string
        default: ""
      pre-build-run:
        description: >-
          Shell to run in project-dir before `pio run`. PIO_ENV, FW_VERSION and
          RELEASE_TYPE are exported, so a hook can act per environment or only
          for a release -- creating the tag that ESP-IDF derives PROJECT_VER
          from, for instance.
        type: string
        default: ""
      post-build-run:
        description: >-
          Shell to run in project-dir after a successful `pio run`. PIO_ENV,
          FW_VERSION and RELEASE_TYPE are exported.
        type: string
        default: ""
      release-notes:
        description: >-
          Markdown template prepended to the release description, resolved from
          the repository root. {version}, {type}, {repo}, {sha}, {short_sha},
          {date}, {envs} and {sizes} are substituted; anything else in braces is
          left alone. GitHub's generated changelog follows it. Absent at the
          default path is fine -- absent at a path you set is an error. Set to
          "" to never look.
        type: string
        default: .github/release-notes.md
      retention-days:
        type: number
        default: 30
      cache-packages:
        type: boolean
        default: true
      size-diff:
        description: >-
          On pull requests, build the base commit too and post the flash/RAM
          delta as a comment. The calling job needs pull-requests: write for the
          comment; without it the diff still lands in the job summary.
        type: boolean
        default: true
      size-warn-bytes:
        description: Image growth at or above this many bytes is flagged.
        type: number
        default: 2048
      size-fail-pct:
        description: Fail when an image reaches this percent of its app partition.
        type: number
        default: 95
      actions-ref:
        description: >-
          Which pio-actions ref supplies the composite actions. Consumers leave
          this alone. The repo's own e2e run sets it to the commit under test,
          so a pull request validates its own actions instead of the last tag.
        type: string
        default: v1
    secrets:
      gh-token:
        description: Token for private lib_deps. Omit if all deps are public.
        required: false
    outputs:
      version:
        description: The version string stamped into the firmware.
        value: ${{ jobs.discover.outputs.version }}
      envs:
        description: JSON array of environments built.
        value: ${{ jobs.discover.outputs.envs }}

jobs:
  discover:
    runs-on: ${{ inputs.runs-on }}
    outputs:
      envs: ${{ steps.envs.outputs.envs }}
      version: ${{ steps.version.outputs.version }}
      baseline-sha: ${{ steps.baseline.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Needed to resolve the merge base below.
          fetch-depth: ${{ inputs.fetch-depth }}

      - name: Resolve the baseline commit
        id: baseline
        if: github.event_name == 'pull_request'
        env:
          FALLBACK: ${{ github.event.pull_request.base.sha }}
        run: |
          # HEAD is the merge commit GitHub generates for the pull request:
          # parent 1 is the base branch tip, parent 2 is the pull request head.
          # Their merge base is where this change actually diverged. base.sha
          # would instead follow the base branch as it moves, quietly folding
          # other people's commits into the diff.
          sha=$(git merge-base "HEAD^1" "HEAD^2" 2>/dev/null || echo "$FALLBACK")
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "baseline: $sha"

      # A release with no version would publish binaries named after a
      # placeholder, so refuse before spending a build on it.
      - name: Validate release inputs
        if: inputs.release-type == 'stable' || inputs.release-type == 'beta'
        env:
          VERSION: ${{ inputs.release-version }}
        run: |
          if [ -z "$VERSION" ] || [ "$VERSION" = "vX.X.X" ]; then
            echo "::error::release-type '${{ inputs.release-type }}' needs a real release-version (got '$VERSION')"
            exit 1
          fi

      - name: Resolve version
        id: version
        env:
          RELEASE_TYPE: ${{ inputs.release-type }}
          RELEASE_VERSION: ${{ inputs.release-version }}
        run: |
          if [ "$RELEASE_TYPE" = "stable" ] || [ "$RELEASE_TYPE" = "beta" ]; then
            version="$RELEASE_VERSION"
          else
            ref="${GITHUB_REF_NAME//[^a-zA-Z0-9]/_}"
            version="${ref}-$(git rev-parse --short HEAD)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building version $version"

      - name: Check out pio-actions
        uses: actions/checkout@v7
        with:
          repository: elliotmatson/pio-actions
          ref: ${{ inputs.actions-ref }}
          path: .pio-actions

      - id: envs
        uses: ./.pio-actions/actions/list-envs
        with:
          project-dir: ${{ inputs.project-dir }}
          select: ${{ inputs.envs }}

  build:
    needs: discover
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
    strategy:
      # One board's failure should not hide the others' results.
      fail-fast: false
      matrix:
        env: ${{ fromJSON(needs.discover.outputs.envs) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ inputs.fetch-depth }}

      - name: Check out pio-actions
        uses: actions/checkout@v7
        with:
          repository: elliotmatson/pio-actions
          ref: ${{ inputs.actions-ref }}
          path: .pio-actions

      # ESP-IDF derives PROJECT_VER from `git describe`, and that version is
      # read back at runtime -- it reaches device screens and logs. The release
      # job only creates the tag after building, so without this a release
      # would ship firmware showing a bare commit hash. A local lightweight tag
      # is enough: git describe reads local refs, and the real remote tag is
      # still created by the release job, only if the build succeeds.
      - name: Tag the release commit
        if: inputs.release-type == 'stable' || inputs.release-type == 'beta'
        env:
          VERSION: ${{ needs.discover.outputs.version }}
        run: |
          git tag -f "$VERSION"
          git describe --always --tags --dirty

      - uses: ./.pio-actions/actions/setup-pio
        with:
          pio-version: ${{ inputs.pio-version }}
          python-version: ${{ inputs.python-version }}
          project-dir: ${{ inputs.project-dir }}
          cache-packages: ${{ inputs.cache-packages }}
          gh-token: ${{ secrets.gh-token }}

      # Substituted in Python rather than the shell: the default template
      # carries nested quotes that the shell would have to escape twice.
      - name: Resolve build flags
        env:
          TEMPLATE: ${{ inputs.version-flags }}
          EXTRA: ${{ inputs.build-flags }}
          VERSION: ${{ needs.discover.outputs.version }}
          RELEASE_TYPE: ${{ inputs.release-type }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          flags=$(python3 - <<'PY'
          import os

          flags = os.environ["TEMPLATE"]
          for token, value in (
              ("{version}", os.environ["VERSION"]),
              ("{type}", os.environ["RELEASE_TYPE"]),
              ("{repo}", os.environ["REPO"]),
          ):
              flags = flags.replace(token, value)
          print(" ".join(p for p in (flags.strip(), os.environ["EXTRA"].strip()) if p))
          PY
          )
          echo "PLATFORMIO_BUILD_FLAGS=$flags" >> "$GITHUB_ENV"
          echo "resolved: $flags"

      - name: Pre-build
        if: inputs.pre-build-run != ''
        working-directory: ${{ inputs.project-dir }}
        env:
          SCRIPT: ${{ inputs.pre-build-run }}
          PIO_ENV: ${{ matrix.env }}
          FW_VERSION: ${{ needs.discover.outputs.version }}
          RELEASE_TYPE: ${{ inputs.release-type }}
        run: bash -c "$SCRIPT"

      - name: Build ${{ matrix.env }}
        working-directory: ${{ inputs.project-dir }}
        run: pio run -e "${{ matrix.env }}"

      - name: Build extra targets
        if: inputs.targets != ''
        working-directory: ${{ inputs.project-dir }}
        env:
          TARGETS: ${{ inputs.targets }}
          PIO_ENV: ${{ matrix.env }}
        run: |
          set -euo pipefail
          for target in $TARGETS; do
            echo "::group::pio run -e $PIO_ENV -t $target"
            pio run -e "$PIO_ENV" -t "$target"
            echo "::endgroup::"
          done

      - name: Post-build
        if: inputs.post-build-run != ''
        working-directory: ${{ inputs.project-dir }}
        env:
          SCRIPT: ${{ inputs.post-build-run }}
          PIO_ENV: ${{ matrix.env }}
          FW_VERSION: ${{ needs.discover.outputs.version }}
          RELEASE_TYPE: ${{ inputs.release-type }}
        run: bash -c "$SCRIPT"

      - name: Measure size
        id: size
        uses: ./.pio-actions/actions/firmware-size
        with:
          env: ${{ matrix.env }}
          project-dir: ${{ inputs.project-dir }}
          output: ${{ inputs.project-dir }}/dist/${{ matrix.env }}-manifest.json

      - name: Stage artifacts
        working-directory: ${{ inputs.project-dir }}
        env:
          ENV_NAME: ${{ matrix.env }}
          VERSION: ${{ needs.discover.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          build=".pio/build/$ENV_NAME"

          stage() {  # $1 = file in the build dir, $2 = suffix ('' for the app image)
            [ -f "$build/$1" ] || return 0
            if [ -z "$2" ]; then
              cp -v "$build/$1" "dist/${ENV_NAME}-${VERSION}.bin"
            else
              cp -v "$build/$1" "dist/${ENV_NAME}-${VERSION}-$2.bin"
            fi
          }

          stage firmware.bin ""
          # pioarduino already merges bootloader + partitions + app into a
          # single flashable image. Publishing it saves consumers an esptool
          # merge_bin step and makes a field flash one file instead of three.
          stage firmware.factory.bin factory
          stage bootloader.bin bootloader
          stage partitions.bin partitions
          stage littlefs.bin littlefs
          stage spiffs.bin spiffs
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: ${{ inputs.project-dir }}/dist/*
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error

  base-size:
    name: baseline size
    needs: discover
    if: ${{ inputs.size-diff && github.event_name == 'pull_request' }}
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
    # A baseline that will not build must not red the pull request. The diff
    # degrades to absolute sizes and says so.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJSON(needs.discover.outputs.envs) }}
    steps:
      # Keyed on the base commit, so the baseline is built once per PR rather
      # than again on every push to the branch.
      # The s2 in the key is a manifest-schema token. Bump it whenever the
      # manifest's shape changes: a cached baseline of the old shape diffed
      # against a new-shape head invents differences that are not real.
      - name: Restore cached baseline
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: base-manifests
          key: size-base-s2-${{ runner.os }}-${{ matrix.env }}-${{ needs.discover.outputs.baseline-sha }}

      - uses: actions/checkout@v7
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          ref: ${{ needs.discover.outputs.baseline-sha }}
          fetch-depth: ${{ inputs.fetch-depth }}

      - name: Check out pio-actions
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: elliotmatson/pio-actions
          ref: ${{ inputs.actions-ref }}
          path: .pio-actions

      - name: Check the environment exists at the baseline
        id: baseline-env
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          ENV_NAME: ${{ matrix.env }}
          PROJECT_DIR: ${{ inputs.project-dir }}
        run: |
          # An environment added by this pull request cannot exist at the
          # baseline. Building it would fail loudly for an entirely expected
          # case, so report it as new instead.
          if python3 .pio-actions/scripts/list_envs.py \
               --project-dir "$PROJECT_DIR" --select all | grep -q "\"$ENV_NAME\""; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$ENV_NAME does not exist at the baseline; the size diff will report it as new"
          fi

      - uses: ./.pio-actions/actions/setup-pio
        if: steps.cache.outputs.cache-hit != 'true' && steps.baseline-env.outputs.present == 'true'
        with:
          pio-version: ${{ inputs.pio-version }}
          python-version: ${{ inputs.python-version }}
          project-dir: ${{ inputs.project-dir }}
          cache-packages: ${{ inputs.cache-packages }}
          gh-token: ${{ secrets.gh-token }}

      - name: Build baseline ${{ matrix.env }}
        if: steps.cache.outputs.cache-hit != 'true' && steps.baseline-env.outputs.present == 'true'
        working-directory: ${{ inputs.project-dir }}
        env:
          # Deliberately the *head* version string, and the same flags the head
          # build used. A different one would be a different number of bytes of
          # .rodata, and that noise would show up in the diff as though the
          # change had caused it.
          TEMPLATE: ${{ inputs.version-flags }}
          EXTRA: ${{ inputs.build-flags }}
          VERSION: ${{ needs.discover.outputs.version }}
          RELEASE_TYPE: ${{ inputs.release-type }}
          REPO: ${{ github.repository }}
        run: |
          PLATFORMIO_BUILD_FLAGS=$(python3 - <<'PY'
          import os

          flags = os.environ["TEMPLATE"]
          for token, value in (
              ("{version}", os.environ["VERSION"]),
              ("{type}", os.environ["RELEASE_TYPE"]),
              ("{repo}", os.environ["REPO"]),
          ):
              flags = flags.replace(token, value)
          print(" ".join(p for p in (flags.strip(), os.environ["EXTRA"].strip()) if p))
          PY
          )
          export PLATFORMIO_BUILD_FLAGS
          pio run -e "${{ matrix.env }}"

      - name: Measure baseline
        if: steps.cache.outputs.cache-hit != 'true' && steps.baseline-env.outputs.present == 'true'
        uses: ./.pio-actions/actions/firmware-size
        with:
          env: ${{ matrix.env }}
          project-dir: ${{ inputs.project-dir }}
          output: base-manifests/${{ matrix.env }}-manifest.json
          summary: "false"

      # Only after a clean build, so a failed baseline cannot poison the key
      # with an empty directory that later runs would treat as a hit.
      - name: Cache the baseline
        if: success() && steps.cache.outputs.cache-hit != 'true' && steps.baseline-env.outputs.present == 'true'
        uses: actions/cache/save@v4
        with:
          path: base-manifests
          key: size-base-s2-${{ runner.os }}-${{ matrix.env }}-${{ needs.discover.outputs.baseline-sha }}

      - uses: actions/upload-artifact@v4
        if: success() && (steps.cache.outputs.cache-hit == 'true' || steps.baseline-env.outputs.present == 'true')
        with:
          name: base-manifest-${{ matrix.env }}
          path: base-manifests/${{ matrix.env }}-manifest.json
          retention-days: 1
          if-no-files-found: warn

  size-diff:
    name: size diff
    needs:
      - discover
      - build
      - base-size
    if: ${{ always() && inputs.size-diff && github.event_name == 'pull_request' && needs.build.result == 'success' }}
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Check out pio-actions
        uses: actions/checkout@v7
        with:
          repository: elliotmatson/pio-actions
          ref: ${{ inputs.actions-ref }}
          path: .pio-actions

      - uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          merge-multiple: true
          path: head

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: base-manifest-*
          merge-multiple: true
          path: base

      - name: Render the size diff
        id: diff
        # Failure here means the image outgrew its partition. Report that after
        # the comment is posted, so the reviewer can see the numbers.
        continue-on-error: true
        # Values reach the script through the environment rather than being
        # interpolated into the shell.
        env:
          BASE_SHA: ${{ needs.discover.outputs.baseline-sha }}
          WARN_BYTES: ${{ inputs.size-warn-bytes }}
          FAIL_PCT: ${{ inputs.size-fail-pct }}
        run: |
          mkdir -p base
          python3 .pio-actions/scripts/size_diff.py \
            --head head --base base \
            --base-label "\`${BASE_SHA:0:7}\`" \
            --warn-bytes "$WARN_BYTES" \
            --fail-pct "$FAIL_PCT" \
            --output size-comment.md

      - name: Post or update the size comment
        if: hashFiles('size-comment.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          marker='<!-- pio-actions:size-diff -->'
          # Python rather than jq: the comment body is arbitrary markdown and
          # this keeps the quoting entirely out of the shell.
          python3 -c 'import json;print(json.dumps({"body":open("size-comment.md").read()}))' > payload.json

          existing=$(gh api "repos/$REPO/issues/$PR/comments?per_page=100" \
            --jq "map(select(.body | startswith(\"$marker\"))) | .[0].id // empty" \
            2>/dev/null || true)

          if [ -n "$existing" ]; then
            target="repos/$REPO/issues/comments/$existing"; method=PATCH
          else
            target="repos/$REPO/issues/$PR/comments"; method=POST
          fi

          if ! gh api -X "$method" "$target" --input payload.json >/dev/null; then
            echo "::warning::Could not post the size comment. Grant the calling \
          job pull-requests: write, or read the diff in the job summary above. \
          A pull request from a fork cannot be commented on from this event."
          fi

      - name: Fail if an image outgrew its partition
        if: steps.diff.outcome == 'failure'
        run: |
          echo "::error::the size diff reported a partition problem; see the comment"
          exit 1

  release:
    needs:
      - discover
      - build
    if: inputs.release-type == 'stable' || inputs.release-type == 'beta'
    runs-on: ${{ inputs.runs-on }}
    # Deliberately no permissions block. A reusable workflow's requests are
    # validated statically, even for a job an `if` will skip, so requesting
    # contents: write here would force every caller -- including one that only
    # ever builds pull requests -- to grant it. Callers that release grant
    # contents: write themselves and this inherits it.
    steps:
      # Before the download: checkout empties the workspace, which would take
      # dist with it.
      - uses: actions/checkout@v7

      - name: Check out pio-actions
        if: inputs.release-notes != ''
        uses: actions/checkout@v7
        with:
          repository: elliotmatson/pio-actions
          ref: ${{ inputs.actions-ref }}
          path: .pio-actions

      - uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          merge-multiple: true
          path: dist

      - name: Checksums
        run: |
          cd dist
          # Not ./*.bin: the prefix ends up in the published checksum file.
          sha256sum -- *.bin | tee SHA256SUMS
          ls -l

      - name: Render the release notes
        id: notes
        if: inputs.release-notes != ''
        env:
          TEMPLATE: ${{ inputs.release-notes }}
          # Keep in step with the input's default below.
          DEFAULT: .github/release-notes.md
          VERSION: ${{ needs.discover.outputs.version }}
          RELEASE_TYPE: ${{ inputs.release-type }}
          REPO: ${{ github.repository }}
          ENVS: ${{ needs.discover.outputs.envs }}
        run: |
          set -euo pipefail
          if [ ! -f "$TEMPLATE" ]; then
            # A repo that has not written one yet still releases, with the
            # generated notes alone. A path the caller typed out and got wrong
            # is a different thing, and says so.
            if [ "$TEMPLATE" = "$DEFAULT" ]; then
              echo "::notice::no $TEMPLATE here; the release keeps GitHub's generated notes only"
              exit 0
            fi
            echo "::error::release-notes points at $TEMPLATE, which does not exist"
            exit 1
          fi

          python3 .pio-actions/scripts/release_notes.py \
            --template "$TEMPLATE" \
            --manifests dist \
            --envs "$ENVS" \
            --version "$VERSION" \
            --type "$RELEASE_TYPE" \
            --repo "$REPO" \
            --sha "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/release-notes.md"

          # Outside the workspace: the repository is checked out here and may
          # well own a file by that name.
          if [ -s "$RUNNER_TEMP/release-notes.md" ]; then
            echo "path=$RUNNER_TEMP/release-notes.md" >> "$GITHUB_OUTPUT"
            { echo "### Release notes"; cat "$RUNNER_TEMP/release-notes.md"; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: ncipollo/release-action@v1
        with:
          artifacts: "dist/*.bin,dist/SHA256SUMS"
          # GitHub prepends the body to the notes it generates, so the template
          # leads and the changelog follows. An empty bodyFile is ignored.
          bodyFile: ${{ steps.notes.outputs.path }}
          generateReleaseNotes: true
          tag: ${{ needs.discover.outputs.version }}
          commit: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: ${{ inputs.release-type == 'beta' }}
          makeLatest: ${{ inputs.release-type == 'stable' }}
