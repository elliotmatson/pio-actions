# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "github-actions"
    # "/" covers .github/workflows and a root action.yml -- and nothing else.
    # actions/setup-pio/action.yml is a composite action in a subdirectory, so
    # it is invisible to Dependabot without being named here. It went a full
    # major behind on setup-python and cache that way, in the one file every
    # consumer repo runs.
    directories:
      - "/"
      # Glob rather than naming setup-pio: list-envs and firmware-size have no
      # `uses:` today, but the failure is silent when that changes, so the
      # pattern covers whatever is added later too.
      - "/actions/*"
    schedule:
      interval: "weekly"
