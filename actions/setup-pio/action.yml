name: Set up PlatformIO
description: >-
  Install a pinned PlatformIO with a cache that actually invalidates, and
  authenticate git for private library dependencies.

inputs:
  pio-version:
    description: >-
      PlatformIO core version, or "latest" (the default) to leave it unpinned.

      The version is coupled to the pioarduino platform. 55.03.312 and later
      require Core >= 6.2.0, which is what "latest" gives. 55.03.311 and earlier
      break under 6.2.0 -- it installs tool-scons ~4.41101.0 over the SCons
      4.8.1 they pin, failing with "No module named 'SCons.Tool.FortranCommon'"
      -- so a project still on one of those must pass "6.1.19".

      The default was 6.1.19 until every consumer had moved to 55.03.312.
    default: latest
  python-version:
    default: "3.12"
  gh-token:
    description: >-
      Token for `gh auth setup-git`, so lib_deps pointing at private repos
      resolve. Omit for projects with only public dependencies.
    default: ""
  project-dir:
    default: "."
  cache:
    description: >-
      Cache pip downloads and the PlatformIO download cache. "auto" (the
      default) caches on GitHub-hosted runners and skips it on self-hosted
      ones. "true" and "false" force it either way.
    default: auto
  cache-packages:
    description: >-
      Also cache extracted platforms and toolchains (~/.platformio/packages).
      Same auto/true/false meaning as `cache`, and ignored when `cache` is off.
    default: auto
  isolate-core:
    description: >-
      Give each distinct set of `platform =` lines in platformio.ini its own
      PlatformIO core directory (PLATFORMIO_CORE_DIR), under
      ~/.platformio-cores/. "auto" (the default) does this on self-hosted
      runners whenever the package cache is off -- the case where ~/.platformio
      is a persistent volume shared by every job on the host. "true" and "false"
      force it either way.

      Why: the pioarduino platforms install each toolchain under a fixed,
      unversioned name, in both ~/.platformio/tools and ~/.platformio/packages.
      Two jobs on different platform versions sharing one core overwrite each
      other's toolchain. An IDF 6 trial branch installed xtensa-esp-elf 15.2
      over the 14.2 that the IDF 5.5 builds use, and every later job on that
      runner failed with "Missing toolchain directory". A core per platform
      costs a cold install the first time a platform is used and ~2.5 GB of disk
      per platform; cores unused for 30 days are removed.

      `platform = native` is left out of the key. It builds with the host
      compiler and installs no toolchain that could collide, so a project with
      a host-test env shares a core with one that has none.
    default: auto

outputs:
  cache-hit:
    description: Whether the toolchain cache was an exact hit.
    value: ${{ steps.cache-packages.outputs.cache-hit }}
  core-dir:
    description: The PlatformIO core directory in use (empty when not isolated).
    value: ${{ steps.isolate.outputs.core-dir }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    # Keyed on platformio.ini, unlike the per-repo copies this replaces: those
    # used a constant key, so bumping a platform silently reused the toolchain
    # built for the old one. restore-keys still gives a warm start on a miss.
    # Measured on a self-hosted runner with a persisted ~/.platformio: a hit
    # restored 795 MB + 1712 MB in 6m57s, of which 236s was unpacking, to
    # produce files already on the volume -- most of an 8-minute job. The
    # entries are also ~2.5 GB against a 10 GB per-repo limit, so they evict
    # each other and a lookup usually misses anyway. Skipping the cache where
    # the tool directory survives is strictly faster.
    #
    # A self-hosted runner that is genuinely ephemeral wants the cache, so this
    # is a default rather than a rule: pass cache: true to force it back on.
    - name: Decide whether to cache
      id: cachecfg
      shell: bash
      env:
        CACHE: ${{ inputs.cache }}
        CACHE_PACKAGES: ${{ inputs.cache-packages }}
        ENVIRONMENT: ${{ runner.environment }}
      run: |
        set -euo pipefail
        resolve() {
          case "$1" in
            true)  echo true ;;
            false) echo false ;;
            *)     if [ "$ENVIRONMENT" = "self-hosted" ]; then echo false; else echo true; fi ;;
          esac
        }
        downloads=$(resolve "$CACHE")
        packages=$(resolve "$CACHE_PACKAGES")
        # The packages cache is a subset of the same decision: caching the
        # unpacked toolchain without the downloads that built it is incoherent.
        [ "$downloads" = "true" ] || packages=false
        {
          echo "downloads=$downloads"
          echo "packages=$packages"
        } >> "$GITHUB_OUTPUT"
        echo "runner.environment=$ENVIRONMENT -> cache downloads=$downloads, packages=$packages"

    # Before anything runs pio: PLATFORMIO_CORE_DIR has to be in place for the
    # first install, or the platform lands in the shared core after all.
    - name: Isolate the PlatformIO core per platform
      id: isolate
      shell: bash
      env:
        ISOLATE: ${{ inputs.isolate-core }}
        ENVIRONMENT: ${{ runner.environment }}
        PACKAGES_CACHED: ${{ steps.cachecfg.outputs.packages }}
        PROJECT_DIR: ${{ inputs.project-dir }}
      run: |
        set -euo pipefail
        case "$ISOLATE" in
          true)  isolate=true ;;
          false) isolate=false ;;
          *)     if [ "$ENVIRONMENT" = "self-hosted" ] && [ "$PACKAGES_CACHED" != "true" ]; then isolate=true; else isolate=false; fi ;;
        esac
        # The cache steps below save and restore ~/.platformio, so an isolated
        # core with caching on would cache the wrong directory.
        if [ "$isolate" = "true" ] && [ "$PACKAGES_CACHED" = "true" ]; then
          echo "::warning::isolate-core with cache-packages on: the cache covers ~/.platformio, not the isolated core"
        fi
        if [ "$isolate" != "true" ]; then
          echo "PlatformIO core: shared (~/.platformio)"
          echo "core-dir=" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        ini="$PROJECT_DIR/platformio.ini"
        # Every `platform =` value, comments and trailing space stripped, in a
        # stable order. Two projects on the same platform share a core; any
        # difference in the line -- a version bump, a trial URL -- gets its own.
        #
        # `native` is dropped, in any spelling (`native`, `native@1.2.1`,
        # `platformio/native @ ^1.2.1`). It installs no toolchain, so it cannot
        # collide -- but counting it gave lp-p2p, identical to hub apart from its
        # host-test env, a second 2.5 GB copy of the same ESP32 toolchain.
        # `|| true`: grep -v exits 1 when nothing survives, as in a project whose
        # only env is native, and pipefail would otherwise end the step.
        platforms=""
        if [ -f "$ini" ]; then
          platforms=$(sed -nE 's/^[[:space:]]*platform[[:space:]]*=[[:space:]]*([^;#]*).*/\1/p' "$ini" \
                      | sed -E 's/[[:space:]]+$//' \
                      | { grep -vE '^(platformio/)?native([[:space:]]*@.*)?$' || true; } \
                      | sort -u)
        fi
        if command -v sha256sum >/dev/null; then hash=sha256sum; else hash="shasum -a 256"; fi
        key=$(printf '%s\n' "$platforms" | $hash | cut -c1-12)
        root="$HOME/.platformio-cores"
        core="$root/$key"
        mkdir -p "$core"
        printf '%s\n' "$platforms" > "$core/.platforms"
        touch "$core/.last-used"

        # Prune cores no job has used for 30 days. Keyed on .last-used rather
        # than the directory's mtime, which only moves when entries are added.
        for dir in "$root"/*/; do
          [ -f "$dir.last-used" ] || continue
          [ "${dir%/}" = "$core" ] && continue
          if [ -n "$(find "$dir.last-used" -mtime +30 2>/dev/null)" ]; then
            echo "Removing unused PlatformIO core ${dir%/}"
            rm -rf "${dir%/}"
          fi
        done

        echo "PLATFORMIO_CORE_DIR=$core" >> "$GITHUB_ENV"
        echo "core-dir=$core" >> "$GITHUB_OUTPUT"
        echo "PlatformIO core: $core"
        echo "for platform(s):"
        printf '  %s\n' $platforms

    - name: Cache pip and PlatformIO downloads
      if: steps.cachecfg.outputs.downloads == 'true'
      uses: actions/cache@v6
      with:
        path: |
          ~/.cache/pip
          ~/.platformio/.cache
        key: pio-dl-${{ runner.os }}-py${{ inputs.python-version }}-pio${{ inputs.pio-version }}-${{ hashFiles(format('{0}/platformio.ini', inputs.project-dir)) }}
        restore-keys: |
          pio-dl-${{ runner.os }}-py${{ inputs.python-version }}-pio${{ inputs.pio-version }}-
          pio-dl-${{ runner.os }}-

    - name: Cache PlatformIO platforms and toolchains
      id: cache-packages
      if: steps.cachecfg.outputs.packages == 'true'
      uses: actions/cache@v6
      with:
        path: |
          ~/.platformio/packages
          ~/.platformio/platforms
        key: pio-pkg-${{ runner.os }}-pio${{ inputs.pio-version }}-${{ hashFiles(format('{0}/platformio.ini', inputs.project-dir)) }}
        restore-keys: |
          pio-pkg-${{ runner.os }}-pio${{ inputs.pio-version }}-

    - name: Install PlatformIO
      shell: bash
      env:
        PIO_VERSION: ${{ inputs.pio-version }}
      run: |
        python -m pip install --upgrade pip
        if [ -z "$PIO_VERSION" ] || [ "$PIO_VERSION" = "latest" ]; then
          pip install --upgrade platformio pyelftools
        else
          pip install "platformio==$PIO_VERSION" pyelftools
        fi
        pio --version

    - name: Authenticate git for private libraries
      if: inputs.gh-token != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh-token }}
      run: |
        gh auth setup-git
        # The helper gh installs shells back out to `gh auth git-credential`,
        # which reads GH_TOKEN from the environment at the moment git asks for
        # credentials -- during `pio run`, long after this step has ended.
        # Without persisting it, a private lib_deps fails to clone with
        # "could not read Username for 'https://github.com'".
        echo "GH_TOKEN=$GH_TOKEN" >> "$GITHUB_ENV"
